services:
  - type: web
    name: ai-builder
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    releaseCommand: pnpm db:migrate
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_GATEWAY_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: BLOB_READ_WRITE_TOKEN
        sync: false
